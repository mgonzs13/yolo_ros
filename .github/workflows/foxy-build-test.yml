name: Foxy Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  foxy_build_and_test:
    runs-on: ubuntu-latest
    container:
      image: ros:foxy
    steps:
      - name: Update installed packages
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get -y upgrade
          apt-get -y install curl
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Provide custom ONNX Runtime
        shell: bash
        run: |
          bash scripts/fetch_onnxruntime.sh /tmp/onnxruntime
      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: yolo_bringup yolo_ros
          target-ros2-distro: foxy
          skip-tests: false
          coverage-result: false
          colcon-defaults: |
            {
              "build": {
                "cmake-args": ["-DONNXRUNTIME_ROOT=/tmp/onnxruntime"]
              },
              "test": {
                "parallel-workers" : 1
              }
            }
