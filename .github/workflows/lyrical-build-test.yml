name: Lyrical Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  lyrical_build_and_test:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical
    steps:
      - name: Update installed packages
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get -y upgrade
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: yolo_bringup yolo_ros
          target-ros2-distro: lyrical
          skip-tests: false
          coverage-result: false
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
