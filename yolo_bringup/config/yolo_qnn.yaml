# VENTUNO Q preset: detection and tracking on the Hexagon NPU (QCS8275).
# The W8A8 QNN artifacts are produced by scripts/compile_qnn_models.py and
# must exist in the configured model_repo/model_path. See docs/models.md
# ("Qualcomm QNN (Hexagon NPU)").
#
# IMPORTANT: rclcpp loads `--params-file` sections by the node's fully
# qualified name, so the block key includes the launch namespace (default
# "yolo"). If you change `namespace:=`, update the block name to match.
/yolo/yolo_node:
  ros__parameters:
    plugins: ["detection", "tracking", "debug"]
    cameras: ["cam0"]
    cam0:
      rgb_topic: /camera/rgb/image_raw
      image_reliability: 1
    detection:
      plugin: yolo_ros/DetectionPlugin
      model_repo: unileon-robotics/YOLO26-QNN
      # Self-caching W8A8 QDQ model (compiled on first use). The precompiled
      # qnn/yolo26s_w8a8.ctx.onnx is used only when AI Hub returns a
      # single-file wrap. model_repo must be populated with the compiled
      # artifacts, or cleared (model_repo: "") in favor of a local model_path.
      model_filename: qnn/yolo26s_w8a8.onnx
      provider: qnn
      device: qnn:0
      max_batch_size: 1
      qnn_htp_performance_mode: burst
      cameras: ["cam0"]
    tracking:
      plugin: yolo_ros/TrackingPlugin
      cameras: ["cam0"]
      tracker_type: bytetrack
    debug:
      plugin: yolo_ros/DebugPlugin
      cameras: ["cam0"]
