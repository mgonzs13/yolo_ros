# Pose preset: same layout as yolo.yaml, the `detection` block selects a pose
# ONNX export.
/yolo/yolo_node:
  ros__parameters:
    plugins: ["detection", "tracking", "detection3d", "debug"]
    cameras: ["cam0"]
    cam0:
      rgb:
        topic: /camera/rgb/image_raw
        reliability: 2
      depth:
        topic: /camera/depth/image_raw
        info_topic: /camera/depth/camera_info
        reliability: 2
    detection:
      plugin: yolo_ros/DetectionPlugin
      model:
        type: pose
        repo: unileon-robotics/YOLO26-ONNX
        filename: yolo26s-pose.onnx
      inference:
        threshold: 0.7
        iou: 0.45
      cpu:
        n_threads: -1
      input:
        width: 640
        height: 480
      provider: cuda
      cameras: ["cam0"]
    tracking:
      plugin: yolo_ros/TrackingPlugin
      cameras: ["cam0"]
      tracker_type: bytetrack
      track:
        high_thresh: 0.25
        low_thresh: 0.1
        new_thresh: 0.25
        buffer: 30
        match_thresh: 0.8
        fuse_score: true
    detection3d:
      plugin: yolo_ros/Detect3DPlugin
      cameras: ["cam0"]
      target_frame: base_link
    debug:
      plugin: yolo_ros/DebugPlugin
      cameras: ["cam0"]
      marker_lifetime: 0.5
