# Classification preset: detection + debug only (no tracking/3D instances),
# the `detection` block selects a classification ONNX export.
/yolo/yolo_node:
  ros__parameters:
    plugins: ["detection", "debug"]
    cameras: ["cam0"]
    cam0:
      rgb:
        topic: /camera/rgb/image_raw
        reliability: 2
      depth:
        topic: /camera/depth/image_raw
        info_topic: /camera/depth/camera_info
        reliability: 2
    detection:
      plugin: yolo_ros/DetectionPlugin
      model:
        type: classify
        repo: unileon-robotics/YOLO26-ONNX
        filename: yolo26s-cls.onnx
      inference:
        threshold: 0.7
        iou: 0.45
        top_k: 5
      cpu:
        n_threads: -1
      input:
        width: 640
        height: 480
      provider: cuda
      cameras: ["cam0"]
    debug:
      plugin: yolo_ros/DebugPlugin
      cameras: ["cam0"]
      marker_lifetime: 0.5
